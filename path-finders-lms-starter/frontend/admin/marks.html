<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Student Marks | Path Finders Admin</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="container" style="padding-top:2rem; padding-bottom:4rem;">
    <a href="dashboard.html" style="text-decoration:none; color:#475569; font-weight:600;">← Back to Admin Portal</a>
    <h1 style="margin-top:0.5rem; margin-bottom:1.5rem;">📊 Record & Edit Student Marks</h1>

    <div id="adminMessage"></div>

    <!-- Mark Entry Form Card -->
    <div class="card" style="margin-bottom:2.5rem; padding:1.5rem; border-radius:12px;">
      <h3 style="margin-top:0; margin-bottom:1rem;">➕ Enter / Update Marks</h3>
      <form id="recordMarkForm" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; align-items:end;">
        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Select Student</label>
          <select id="markStudentSelect" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
            <option value="">-- Choose Student --</option>
          </select>
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Assessment / Exam</label>
          <select id="markAssessmentSelect" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
            <option value="">-- Choose Assessment --</option>
          </select>
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Mark (Out of 100)</label>
          <input type="number" id="markScore" min="0" max="100" step="0.5" placeholder="e.g. 85" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">💾 Save Student Mark</button>
        </div>
      </form>
    </div>

    <!-- Marks History Table -->
    <h2>Recorded Marks Overview</h2>
    <div class="card table-wrap" style="overflow-x:auto; margin-top:1rem;">
      <table class="table" style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="background:#f8fafc; text-align:left;">
            <th style="padding:12px;">Student Name</th>
            <th style="padding:12px;">Assessment Title</th>
            <th style="padding:12px;">Subject</th>
            <th style="padding:12px;">Mark</th>
            <th style="padding:12px;">Date Recorded</th>
            <th style="padding:12px; text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="marksTableBody">
          <tr><td colspan="6" style="padding:20px; text-align:center;" class="muted">Loading recorded marks...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
