<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard | Path Finders</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <section class="page-head">
      <h1>Student Dashboard</h1>
      <p class="muted">Welcome back. Your academic overview appears below.</p>
    </section>
    <div class="grid-4">
      <div class="card"><span class="muted">Overall Average</span><div id="overall" class="stat">—</div></div>
      <div class="card"><span class="muted">Completed Assessments</span><div id="assessmentCount" class="stat">—</div></div>
      <div class="card"><span class="muted">Term Exam Average</span><div id="termAverage" class="stat">—</div></div>
      <div class="card"><span class="muted">Latest Exam Score</span><div id="latest" class="stat">—</div></div>
    </div>
    <section class="section">
      <div class="grid-3">
        <a class="card" href="progress.html"><h3>📈 My Progress</h3><p class="muted">View tables and progress graphs.</p></a>
        <a class="card" href="assessments.html"><h3>📝 Assessments</h3><p class="muted">View monthly results.</p></a>
        <a class="card" href="library.html"><h3>📚 Library</h3><p class="muted">Open subject resources.</p></a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
