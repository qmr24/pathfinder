<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Profile | Path Finders</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <section class="page-head">
      <h1>My Student Profile</h1>
      <p class="muted">Your registered academic details and stream combination.</p>
    </section>
    <div class="card">
      <div class="two-col">
        <div><b>Full Name</b><p id="name">—</p></div>
        <div><b>Student ID</b><p id="studentId">—</p></div>
        <div><b>Subject Combination</b><p id="combination">—</p></div>
        <div><b>School / Institution</b><p id="school">—</p></div>
      </div>
      <p class="muted" style="margin-top:15px">Academic marks and official results are protected and cannot be modified by students.</p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
