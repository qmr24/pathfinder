<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Progress | Path Finders</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <section class="page-head">
      <h1>My Academic Progress</h1>
      <p class="muted">Exact marks and real database-driven visualisations.</p>
    </section>
    
    <section class="card">
      <h2>Monthly Assessment Progress</h2>
      <div class="table-wrap">
        <table class="table" id="monthlyTable">
          <thead>
            <tr>
              <th>Assessment Title</th>
              <th>Accounting</th>
              <th>Economics</th>
              <th>ICT / BS</th>
              <th>Mark Obtained</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div style="height:330px;margin-top:25px">
        <canvas id="monthlyChart"></canvas>
      </div>
    </section>

    <section class="card" style="margin-top:20px">
      <h2>Four Term Examination Matrix</h2>
      <div class="table-wrap">
        <table class="table" id="termTable">
          <thead>
            <tr>
              <th>Subject</th>
              <th>Term 1</th>
              <th>Term 2</th>
              <th>Term 3</th>
              <th>Term 4</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div style="height:330px;margin-top:25px">
        <canvas id="termChart"></canvas>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/progress.js"></script>
</body>
</html>
