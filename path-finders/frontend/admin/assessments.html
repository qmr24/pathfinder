<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Assessments & Google Forms | Path Finders Admin</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="container" style="padding-top:2rem; padding-bottom:4rem;">
    <a href="dashboard.html" style="text-decoration:none; color:#475569; font-weight:600;">← Back to Admin Portal</a>
    <h1 style="margin-top:0.5rem; margin-bottom:1.5rem;">📝 Manage Assessments & Google Form Exams</h1>

    <div id="adminMessage"></div>

    <!-- Create Assessment Card -->
    <div class="card" style="margin-bottom:2.5rem; padding:1.5rem; border-radius:12px;">
      <h3 style="margin-top:0; margin-bottom:1rem;">➕ Add New Google Form Exam / Assessment</h3>
      <form id="createAssessmentForm" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:1rem; align-items:end;">
        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Assessment Title</label>
          <input type="text" id="assessmentTitle" placeholder="e.g. Accounting January Test 01" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Subject</label>
          <select id="assessmentSubjectSelect" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
            <option value="">-- Select Subject --</option>
          </select>
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Google Form URL</label>
          <input type="url" id="assessmentFormUrl" placeholder="https://forms.google.com/..." required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Max Mark</label>
          <input type="number" id="assessmentMaxMark" value="100" min="1" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Assessment Date</label>
          <input type="date" id="assessmentDate" style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">🚀 Publish Assessment</button>
        </div>
      </form>
    </div>

    <!-- Active Assessments List -->
    <h2>Published Assessments</h2>
    <div class="card table-wrap" style="overflow-x:auto; margin-top:1rem;">
      <table class="table" style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="background:#f8fafc; text-align:left;">
            <th style="padding:12px;">Title</th>
            <th style="padding:12px;">Subject</th>
            <th style="padding:12px;">Google Form Link</th>
            <th style="padding:12px;">Date</th>
            <th style="padding:12px;">Status</th>
            <th style="padding:12px; text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="assessmentTableBody">
          <tr><td colspan="6" style="padding:20px; text-align:center;" class="muted">Loading assessments...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
