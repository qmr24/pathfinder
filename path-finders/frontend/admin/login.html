<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login | Path Finders</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="../index.html">PATH <span>FINDERS</span></a>
      <h1>Admin Login</h1>
      <p>Authorized administrators only. There is no public admin sign-up.</p>
      <form id="adminLoginForm" class="form">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <div id="message"></div>
        <button class="btn btn-primary" type="submit">Log In</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
