<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Resource Links | Path Finders Admin</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="container" style="padding-top:2rem; padding-bottom:4rem;">
    <a href="dashboard.html" style="text-decoration:none; color:#475569; font-weight:600;">← Back to Admin Portal</a>
    <h1 style="margin-top:0.5rem; margin-bottom:1.5rem;">📚 Manage Learning Resource Links & Documents</h1>

    <div id="adminMessage"></div>

    <!-- Create Resource Card -->
    <div class="card" style="margin-bottom:2.5rem; padding:1.5rem; border-radius:12px;">
      <h3 style="margin-top:0; margin-bottom:1rem;">➕ Add New Resource Link / Document</h3>
      <form id="createResourceForm" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:1rem; align-items:end;">
        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Resource Title</label>
          <input type="text" id="resourceTitle" placeholder="e.g. 2026 Economics Model Paper" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Subject</label>
          <select id="resourceSubjectSelect" style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
            <option value="acc">Accounting</option>
            <option value="eco">Economics</option>
            <option value="bus">Business Studies</option>
            <option value="ict">ICT</option>
          </select>
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">Category</label>
          <select id="resourceCategorySelect" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
            <option value=""></option>
            <option value="past_papers">Past Papers</option>
            <option value="study_notes">Study Notes</option>
            <option value="textbooks">Textbooks</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label style="font-weight:600; display:block; margin-bottom:4px;">File / Link URL</label>
          <input type="url" id="resourceFileUrl" placeholder="https://drive.google.com/... or PDF link" required style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div style="grid-column: 1 / -1;">
          <label style="font-weight:600; display:block; margin-bottom:4px;">Description</label>
          <input type="text" id="resourceDescription" placeholder="Short description of this material..." style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>

        <div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">💾 Publish Resource</button>
        </div>
      </form>
    </div>

    <!-- Published Resources List -->
    <h2>Learning Library Resources</h2>
    <div class="card table-wrap" style="overflow-x:auto; margin-top:1rem;">
      <table class="table" style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="background:#f8fafc; text-align:left;">
            <th style="padding:12px;">Title</th>
            <th style="padding:12px;">Subject</th>
            <th style="padding:12px;">Category</th>
            <th style="padding:12px;">Resource Link</th>
            <th style="padding:12px;">Added Date</th>
            <th style="padding:12px; text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="resourceTableBody">
          <tr><td colspan="6" style="padding:20px; text-align:center;" class="muted">Loading resource library...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
