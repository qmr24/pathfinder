<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Login | Path Finders</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">PATH <span>FINDERS</span></a>
      <h1>Student Login</h1>
      <p>Sign in to access your private student portal.</p>
      <form id="loginForm" class="form">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <div id="message"></div>
        <button class="btn btn-primary" type="submit">Log In</button>
      </form>
      <p>New student? <a href="signup.html" style="color:var(--primary);font-weight:800">Create an account</a></p>
      <p><a href="admin/login.html" style="color:var(--muted)">Admin Login</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
