<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Student Account | Path Finders</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">PATH <span>FINDERS</span></a>
      <h1>Create Student Account</h1>
      <p>Register as a student. Admin accounts are created separately.</p>
      <form id="signupForm" class="form">
        <div class="field"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" required></div>
        <div class="field"><label for="studentId">Student ID / Username</label><input id="studentId" autocomplete="username" required></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="school">School</label><input id="school" autocomplete="organization"></div>
        <div class="field"><label for="batch">A/L batch/year</label><input id="batch" inputmode="numeric" placeholder="e.g. 2027"></div>
        <div class="field"><label for="combination">Subject combination</label><select id="combination" required><option value="">Select</option><option value="commerce_ict">Accounting + Economics + ICT</option><option value="commerce_bs">Accounting + Economics + Business Studies</option></select></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <div id="message"></div>
        <button class="btn btn-primary" type="submit">Create Account</button>
      </form>
      <p>Already have an account? <a href="login.html" style="color:var(--primary);font-weight:800">Student Login</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
