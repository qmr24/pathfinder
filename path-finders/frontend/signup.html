<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Student Account | Path Finders</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html">PATH <span>FINDERS</span></a><h1>Create Student Account</h1><p>Register as a student. Admin accounts are created separately.</p><form id="signupForm" class="form"><div class="field"><label>Full name</label><input id="fullName" required></div><div class="field"><label>Student ID / Username</label><input id="studentId" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>School</label><input id="school"></div><div class="field"><label>A/L batch/year</label><input id="batch" placeholder="e.g. 2027"></div><div class="field"><label>Subject combination</label><select id="combination" required><option value="">Select</option><option value="commerce_ict">Accounting + Economics + ICT</option><option value="commerce_bs">Accounting + Economics + Business Studies</option></select></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" required></div><div id="message"></div><button class="btn btn-primary" type="submit">Create Account</button></form></section></main><script src="js/auth.js"></script></body></html>
